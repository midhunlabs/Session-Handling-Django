<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>

<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body{
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .home_box{
        background: white;
        padding: 40px;
        width: 420px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .home_box h1{
        color: #333;
        margin-bottom: 15px;
    }

    .home_box h2{
        color: #667eea;
        margin-bottom: 10px;
        font-size: 28px;
    }

    .home_box p{
        color: #555;
        margin-bottom: 25px;
        font-size: 18px;
    }

    .logout_btn{
        display: inline-block;
        text-decoration: none;
        background: #ff0000;
        color: white;
        padding: 12px 25px;
        border-radius: 10px;
        transition: 0.3s;
        font-weight: bold;
    }

    .logout_btn:hover{
        background: #7a0000;
    }
</style>

<div class="home_box">
    <h1>Home Page</h1>

    <h2>Welcome {{ request.user.first_name }}</h2>
    
    <p>{{ request.user.username }}</p>

    <a href="{% url 'logout' %}" class="logout_btn">Logout</a>
</div>

</body>
</html>
