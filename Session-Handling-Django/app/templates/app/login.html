{% extends 'app/base.html' %}

{% block title %} Login {% endblock title %}

{% block content %}

<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body{
        background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .login_wrapper{
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .login_box{
        width: 400px;
        background: white;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .login_box h2{
        text-align: center;
        margin-bottom: 25px;
        color: #333;
    }

    .message{
        text-align: center;
        color: red;
        margin-bottom: 15px;
    }

    .login_box label{
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
        color: #444;
    }

    .login_box input{
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 10px;
        outline: none;
        transition: 0.3s;
    }

    .login_box input:focus{
        border-color: #667eea;
        box-shadow: 0 0 5px rgba(102,126,234,0.5);
    }

    .login_box button{
        width: 100%;
        padding: 12px;
        border: none;
        background: #667eea;
        color: white;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    .login_box button:hover{
        background: #5a67d8;
    }

    .signup_link{
        text-align: center;
        margin-top: 18px;
    }

    .signup_link a{
        text-decoration: none;
        color: #667eea;
        font-weight: bold;
    }

    .signup_link a:hover{
        text-decoration: underline;
    }
</style>

<div class="login_wrapper">
    <div class="login_box">

        <h2>Login Form</h2>

        <p class="message">{{message}}</p>

        <form method="post">
            {% csrf_token %}

            <label>Name</label>
            <input type="text" name="name" required>

            <label>Email</label>
            <input type="email" name="email" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit">Submit</button>
        </form>

        <div class="signup_link">
            <a href="{% url 'signup' %}">Create a new Account</a>
        </div>

    </div>
</div>

{% endblock content %}
