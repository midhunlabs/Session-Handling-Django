{% extends 'app/base.html' %}

{% block title %} Signup {% endblock title %}

{% block content %}

<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body{
        background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .form_div_inside{
        display: flex;
        width: 100%;
        height: 100vh;
        justify-content: center;
        align-items: center;
    }

    .form_div{
        background: white;
        width: 420px;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .form_div h2{
        text-align: center;
        margin-bottom: 25px;
        color: #333;
    }

    .form_div label{
        font-weight: bold;
        display: block;
        margin-bottom: 5px;
        color: #444;
    }

    .form_div input{
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 10px;
        outline: none;
        transition: 0.3s;
    }

    .form_div input:focus{
        border-color: #667eea;
        box-shadow: 0 0 5px rgba(102,126,234,0.5);
    }

    .form_div button{
        width: 100%;
        padding: 12px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    .form_div button:hover{
        background: #5a67d8;
    }

    .message{
        text-align: center;
        color: red;
        margin-bottom: 10px;
    }
</style>

<div class="form_div_inside">
    <div class="form_div">

        <h2>Signup Form</h2>

        <p class="message">{{ message }}</p>

        <form action="{% url 'signup' %}" method="post">
            {% csrf_token %}

            <label>Name</label>
            <input type="text" name="name" required>

            <label>Email</label>
            <input type="email" name="email" required>

            <label>Password</label>
            <input type="password" name="password" required placeholder="Password">

            <label>Re-Password</label>
            <input type="password" name="re-password" required placeholder="Retype Password">

            <button type="submit">Submit</button>
        </form>

    </div>
</div>

{% endblock content %}
